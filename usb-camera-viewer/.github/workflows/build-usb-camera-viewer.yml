name: Build USB Camera Viewer APK

on:
  workflow_dispatch:
  push:
    branches: [ "usb-camera-viewer-v1" ]
    paths:
      - "usb-camera-viewer/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: usb-camera-viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: USB-Camera-Viewer-Test1
          path: usb-camera-viewer/app/build/outputs/apk/debug/app-debug.apk
