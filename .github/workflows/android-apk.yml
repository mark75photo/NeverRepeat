name: Build NeverRepeat APK
on:
  workflow_dispatch:
  push:
    branches: [ android-app ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Prepare packaged web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply NeveRRepeat launcher branding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/$1"
            mkdir -p "$dir"
            rsvg-convert -w "$2" -h "$2" brand/rr-icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png" || true
          done
      - name: Add Spotify callback deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          needle='''<intent-filter>\n                <action android:name="android.intent.action.MAIN" />'''
          deep='''<intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="neverrepeat" android:host="callback" />\n            </intent-filter>\n\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />'''
          if needle not in s: raise SystemExit("MainActivity intent filter not found")
          p.write_text(s.replace(needle,deep,1))
          PY
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      - name: Sign NeverRepeat release APK
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/NeverRepeat-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out NeverRepeat.apk "$RUNNER_TEMP/NeverRepeat-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs NeverRepeat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NeverRepeat-release-apk
          path: NeverRepeat.apk
