name: Build NeverRepeat APK
on:
  workflow_dispatch:
  push:
    branches: [ android-app ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - name: Prepare packaged web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp manifest.json www/manifest.json
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply NeveRRepeat launcher branding
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          for spec in "mipmap-mdpi 48" "mipmap-hdpi 72" "mipmap-xhdpi 96" "mipmap-xxhdpi 144" "mipmap-xxxhdpi 192"; do
            set -- $spec
            dir="android/app/src/main/res/$1"
            mkdir -p "$dir"
            rsvg-convert -w "$2" -h "$2" brand/rr-icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_foreground.png" || true
          done
      - name: Add Spotify callback deep link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          needle='''<intent-filter>\n                <action android:name="android.intent.action.MAIN" />'''
          deep='''<intent-filter>\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="neverrepeat" android:host="callback" />\n            </intent-filter>\n\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />'''
          if needle not in s: raise SystemExit("MainActivity intent filter not found")
          p.write_text(s.replace(needle,deep,1))
          PY
      - name: Install native RR background controller
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          anchor='<uses-permission android:name="android.permission.INTERNET" />'
          perms=anchor+'\\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />'
          if 'FOREGROUND_SERVICE_MEDIA_PLAYBACK' not in s: s=s.replace(anchor,perms,1)
          if 'RRBackgroundService' not in s: s=s.replace('</application>','        <service android:name=".RRBackgroundService" android:exported="false" android:foregroundServiceType="mediaPlayback" />\\n    </application>',1)
          p.write_text(s)
          PY
          cat > android/app/src/main/java/com/markhansen/neverrepeat/MainActivity.java <<'JAVA'
          package com.markhansen.neverrepeat;
          import android.content.*; import android.os.Bundle; import android.webkit.JavascriptInterface;
          import androidx.core.content.ContextCompat; import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b){super.onCreate(b);getBridge().getWebView().addJavascriptInterface(new RRBridge(this),"RRNative");ContextCompat.startForegroundService(this,new Intent(this,RRBackgroundService.class));}
            public static class RRBridge { Context c; RRBridge(Context c){this.c=c;}
              @JavascriptInterface public void syncState(String json){c.getSharedPreferences("rr",0).edit().putString("state",json).apply();}
              @JavascriptInterface public String drainPlayed(){android.content.SharedPreferences p=c.getSharedPreferences("rr",0);String s=p.getString("observed","[]");p.edit().putString("observed","[]").apply();return s;}
            }
          }
          JAVA
          cat > android/app/src/main/java/com/markhansen/neverrepeat/RRBackgroundService.java <<'JAVA'
          package com.markhansen.neverrepeat;
          import android.app.*; import android.content.*; import android.os.*; import androidx.core.app.NotificationCompat;
          import org.json.*; import java.io.*; import java.net.*; import java.util.*;
          public class RRBackgroundService extends Service {
            static final String CH="rr_background"; Handler h=new Handler(Looper.getMainLooper()); PowerManager.WakeLock lock; String lastId="";
            Runnable pulse=new Runnable(){public void run(){new Thread(()->pollSpotify()).start();h.postDelayed(this,5000);}};
            @Override public void onCreate(){super.onCreate();NotificationManager nm=getSystemService(NotificationManager.class);nm.createNotificationChannel(new NotificationChannel(CH,"NeveRRepeat playback",NotificationManager.IMPORTANCE_LOW));Intent open=new Intent(this,MainActivity.class);PendingIntent pi=PendingIntent.getActivity(this,0,open,PendingIntent.FLAG_IMMUTABLE|PendingIntent.FLAG_UPDATE_CURRENT);Notification n=new NotificationCompat.Builder(this,CH).setSmallIcon(getApplicationInfo().icon).setContentTitle("NeveRRepeat").setContentText("Remembered Rotation is active").setOngoing(true).setContentIntent(pi).setCategory(NotificationCompat.CATEGORY_SERVICE).build();startForeground(35,n);PowerManager pm=(PowerManager)getSystemService(POWER_SERVICE);lock=pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK,"NeveRRepeat:RR");lock.acquire();h.post(pulse);}
            void pollSpotify(){try{android.content.SharedPreferences p=getSharedPreferences("rr",0);String raw=p.getString("state","");if(raw.isEmpty())return;JSONObject st=new JSONObject(raw);String token=st.optString("token","");if(token.isEmpty())return;HttpURLConnection q=(HttpURLConnection)new URL("https://api.spotify.com/v1/me/player").openConnection();q.setRequestProperty("Authorization","Bearer "+token);q.setConnectTimeout(5000);q.setReadTimeout(5000);int code=q.getResponseCode();if(code!=200)return;BufferedReader br=new BufferedReader(new InputStreamReader(q.getInputStream()));StringBuilder sb=new StringBuilder();String line;while((line=br.readLine())!=null)sb.append(line);JSONObject j=new JSONObject(sb.toString()),item=j.optJSONObject("item");if(item==null)return;String id=item.optString("id","");long pos=j.optLong("progress_ms",0);if(id.isEmpty())return;if(lastId.isEmpty()){lastId=id;return;}if(!id.equals(lastId)){if(pos<30000)addObserved(p,lastId);lastId=id;}}
              catch(Exception e){}
            }
            void addObserved(android.content.SharedPreferences p,String id){try{JSONArray a=new JSONArray(p.getString("observed","[]"));for(int i=0;i<a.length();i++)if(id.equals(a.optString(i)))return;a.put(id);p.edit().putString("observed",a.toString()).apply();}catch(Exception e){}}
            @Override public int onStartCommand(Intent i,int f,int id){return START_STICKY;} @Override public void onDestroy(){h.removeCallbacks(pulse);if(lock!=null&&lock.isHeld())lock.release();super.onDestroy();} @Override public IBinder onBind(Intent i){return null;}
          }
          JAVA
      - name: Build release APK
        run: cd android && ./gradlew assembleRelease
      - name: Restore permanent NeveRRepeat signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neverrepeat-release.jks"
      - name: Sign NeveRRepeat release APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KS_PASS" && test -n "$KEY_PASS" && test -n "$KEY_ALIAS" || { echo "Missing Android signing secret"; exit 1; }
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/NeveRRepeat-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/neverrepeat-release.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out NeveRRepeat.apk "$RUNNER_TEMP/NeveRRepeat-aligned.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs NeveRRepeat.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NeveRRepeat-release-apk
          path: NeveRRepeat.apk
